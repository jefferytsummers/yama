[package]
name = "yama-vlm"
version.workspace = true
edition = "2024"
license.workspace = true
description = "Yama VLM container - Vision Language Model inference for video analysis"

[[bin]]
name = "yama-vlm"
path = "src/main.rs"

[dependencies]
# Internal crates
yama-protocol = { path = "../../shared/protocol" }
yama-container-sdk = { path = "../../shared/container-sdk" }

# VLM inference (mistral.rs)
# Use "metal" feature on macOS with Xcode, "cuda" on Linux with NVIDIA GPU
mistralrs = { version = "0.7", default-features = false }

# Video processing
gstreamer = { workspace = true }
gstreamer-app = { workspace = true }
gstreamer-video = { workspace = true }

# Image processing
image = { workspace = true }

# Async runtime
tokio = { workspace = true }
futures-util = { workspace = true }
async-trait = { workspace = true }

# Protocol
prost = { workspace = true }
prost-types = { workspace = true }
bytes = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio-test = "0.4"

[features]
default = []
metal = ["mistralrs/metal"]
cuda = ["mistralrs/cuda"]
