[package]
name = "yama-tool-file-system"
version.workspace = true
edition = "2024"
license.workspace = true
description = "Yama file system tool - file operations for agents"

[[bin]]
name = "yama-tool-file-system"
path = "src/main.rs"

[dependencies]
# Internal crates
yama-protocol = { path = "../../../shared/protocol" }
yama-container-sdk = { path = "../../../shared/container-sdk" }

# Async runtime
tokio = { workspace = true, features = ["fs"] }
futures-util = { workspace = true }

# Protocol
prost = { workspace = true }
bytes = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Glob patterns
glob = "0.3"
