[package]
name = "yama-agent"
version.workspace = true
edition = "2024"
license.workspace = true
description = "Yama agent runtime container - LLM agent execution environment"

[[bin]]
name = "yama-agent"
path = "src/main.rs"

[dependencies]
# Internal crates
yama-protocol = { path = "../../shared/protocol" }
yama-agent-sdk = { path = "../../shared/agent-sdk" }
yama-container-sdk = { path = "../../shared/container-sdk" }

# Async runtime
tokio = { workspace = true }
futures-util = { workspace = true }

# HTTP for external LLM APIs
reqwest = { workspace = true }

# Protocol
prost = { workspace = true }
bytes = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
