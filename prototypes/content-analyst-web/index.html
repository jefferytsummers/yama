    // ============================================
    // PROJECT CARD COMPONENT
    // ============================================
    function ProjectCard({ project, onClick, onDelete }) {
      const [isHovered, setIsHovered] = useState(false);
      const [showDelete, setShowDelete] = useState(false);

      const formatTimeAgo = (date) => {
        const seconds = Math.floor((new Date() - date) / 1000);
        if (seconds < 60) return 'Just now';
        if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
        if (seconds < 86400) return `${Math.floor(seconds / 3600)}h ago`;
        return `${Math.floor(seconds / 86400)}d ago`;
      };

      return (
        <div
          className="animate-slide-up"
          style={{
            background: isHovered ? 'var(--bg-elevated)' : 'var(--bg-tertiary)',
            borderRadius: 'var(--radius-lg)',
            border: '1px solid var(--border-subtle)',
            overflow: 'hidden',
            cursor: 'pointer',
            transition: 'all 0.2s ease',
            transform: isHovered ? 'translateY(-2px)' : 'none',
            boxShadow: isHovered ? '0 8px 24px rgba(0,0,0,0.2)' : 'none',
          }}
          onMouseEnter={() => { setIsHovered(true); setShowDelete(true); }}
          onMouseLeave={() => { setIsHovered(false); setShowDelete(false); }}
          onClick={onClick}
        >
          {/* Thumbnail area */}
          <div style={{
            height: 120,
            background: 'var(--bg-secondary)',
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'center',
            position: 'relative',
            borderBottom: '1px solid var(--border-subtle)',
          }}>
            <div style={{ color: 'var(--text-muted)', opacity: 0.5 }}>
              <Icons.Folder />
            </div>

            {/* Video count badge */}
            <div style={{
              position: 'absolute',
              top: 10,
              left: 10,
              background: 'var(--bg-elevated)',
              border: '1px solid var(--border-subtle)',
              padding: '4px 8px',
              borderRadius: 'var(--radius-sm)',
              fontSize: 12,
              fontWeight: 500,
              display: 'flex',
              alignItems: 'center',
              gap: 4,
              color: 'var(--text-primary)',
              boxShadow: 'var(--shadow-sm)',
            }}>
              <Icons.Video /> {project.videoCount}
            </div>

            {/* Duration */}
            {project.duration && (
              <div style={{
                position: 'absolute',
                top: 10,
                right: 10,
                background: 'var(--bg-elevated)',
                border: '1px solid var(--border-subtle)',
                padding: '4px 8px',
                borderRadius: 'var(--radius-sm)',
                fontSize: 12,
                color: 'var(--text-secondary)',
                boxShadow: 'var(--shadow-sm)',
              }}>
                {project.duration}
              </div>
            )}

            {/* Delete button */}
            {showDelete && (
              <button
                onClick={(e) => { e.stopPropagation(); onDelete(); }}
                style={{
                  position: 'absolute',
                  bottom: 10,
                  right: 10,
                  width: 32,
                  height: 32,
                  borderRadius: 'var(--radius-sm)',
                  background: 'var(--accent-error)',
                  border: 'none',
                  color: '#fff',
                  cursor: 'pointer',
                  display: 'flex',
                  alignItems: 'center',
                  justifyContent: 'center',
                  transition: 'transform 0.15s',
                }}
                onMouseOver={e => e.currentTarget.style.transform = 'scale(1.1)'}
                onMouseOut={e => e.currentTarget.style.transform = 'scale(1)'}
              >
                <Icons.Trash />
              </button>
            )}
          </div>

          {/* Info */}
          <div style={{ padding: 16 }}>
            <h3 style={{
              fontSize: 15,
              fontWeight: 600,
              marginBottom: 6,
              whiteSpace: 'nowrap',
              overflow: 'hidden',
              textOverflow: 'ellipsis',
            }}>{project.name}</h3>

            <div style={{
              display: 'flex',
              alignItems: 'center',
              justifyContent: 'space-between',
              marginBottom: 8,
            }}>
              <span style={{
                fontSize: 13,
                color: project.indexed === project.videoCount && project.videoCount > 0
                  ? 'var(--accent-success)'
                  : project.indexed > 0
                    ? 'var(--accent-primary)'
                    : 'var(--text-muted)',
              }}>
                {project.videoCount === 0
                  ? 'No videos'
                  : project.indexed === project.videoCount
                    ? 'All indexed'
                    : project.indexed > 0
                      ? `${project.indexed}/${project.videoCount} indexed`
                      : 'Not indexed'}
              </span>
            </div>

            {/* Preset indicator */}
            {project.preset && (
              <div style={{
                display: 'inline-flex',
                alignItems: 'center',
                gap: 4,
                padding: '3px 8px',
                background: 'var(--accent-primary)' + '15',
                border: '1px solid var(--accent-primary)30',
                borderRadius: 'var(--radius-sm)',
                fontSize: 11,
                fontWeight: 500,
                color: 'var(--accent-primary)',
                marginBottom: 8,
              }}>
                {project.preset === 'video-analyst' && '🎬 Video Analyst'}
                {project.preset === 'document-reporter' && '📋 Document Reporter'}
                {project.preset === 'quick-search' && '⚡ Quick Search'}
                {project.preset === 'custom' && '🔧 Custom'}
              </div>
            )}

            <div style={{
              display: 'flex',
              alignItems: 'center',
              gap: 4,
              fontSize: 12,
              color: 'var(--text-muted)',
            }}>
              <Icons.Clock />
              {formatTimeAgo(project.updatedAt)}
            </div>
          </div>
        </div>
      );
    }

    // ============================================
    // DASHBOARD VIEW
    // ============================================
    function Dashboard({ projects, onOpenProject, onCreateProject, onDeleteProject }) {
      const [search, setSearch] = useState('');
      const [showWizard, setShowWizard] = useState(false);
      const [showDeleteModal, setShowDeleteModal] = useState(null);
      const { addToast } = useToast();

      const filteredProjects = projects.filter(p =>
        p.name.toLowerCase().includes(search.toLowerCase())
      );

      const handleCreateFromWizard = (projectData) => {
        onCreateProject(projectData);
      };

      const handleDelete = () => {
        if (showDeleteModal) {
          onDeleteProject(showDeleteModal.id);
          setShowDeleteModal(null);
          addToast('Project deleted', 'info');
        }
      };

      return (
        <div style={{ padding: 32 }}>
          {/* Header */}
          <div style={{
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'space-between',
            marginBottom: 32,
          }}>
            <div>
              <h1 style={{ fontSize: 28, fontWeight: 700, marginBottom: 4 }}>Projects</h1>
              <p style={{ color: 'var(--text-muted)', fontSize: 14 }}>
                {projects.length} project{projects.length !== 1 ? 's' : ''} • {projects.reduce((a, p) => a + p.videoCount, 0)} videos total
              </p>
            </div>
            <Button onClick={() => setShowWizard(true)}>
              <Icons.Plus /> New Project
            </Button>
          </div>

          {/* Search */}
          {projects.length > 0 && (
            <div style={{ marginBottom: 24, maxWidth: 320 }}>
              <Input
                placeholder="Search projects..."
                value={search}
                onChange={setSearch}
                icon={<Icons.Search />}
              />
            </div>
          )}

          {/* Projects Grid or Empty State */}
          {projects.length === 0 ? (
            <EmptyState
              icon={<Icons.Folder />}
              title="No projects yet"
              description="Create your first project to start organizing and analyzing your video content."
              action={
                <Button onClick={() => setShowWizard(true)}>
                  <Icons.Plus /> Create First Project
                </Button>
              }
            />
          ) : filteredProjects.length === 0 ? (
            <EmptyState
              icon={<Icons.Search />}
              title="No results found"
              description={`No projects match "${search}". Try a different search term.`}
            />
          ) : (
            <div style={{
              display: 'grid',
              gridTemplateColumns: 'repeat(auto-fill, minmax(280px, 1fr))',
              gap: 20,
            }}>
              {filteredProjects.map(project => (
                <ProjectCard
                  key={project.id}
                  project={project}
                  onClick={() => onOpenProject(project)}
                  onDelete={() => setShowDeleteModal(project)}
                />
              ))}
            </div>
          )}

          {/* Project Creation Wizard */}
          <ProjectWizard
            isOpen={showWizard}
            onClose={() => setShowWizard(false)}
            onComplete={handleCreateFromWizard}
          />

          {/* Delete Confirmation Modal */}
          <Modal
            isOpen={!!showDeleteModal}
            onClose={() => setShowDeleteModal(null)}
            title="Delete Project"
            width={380}
          >
            <p style={{ color: 'var(--text-secondary)', marginBottom: 20, lineHeight: 1.5 }}>
              Are you sure you want to delete <strong style={{ color: 'var(--text-primary)' }}>{showDeleteModal?.name}</strong>?
              This action cannot be undone.
            </p>
            <div style={{ display: 'flex', gap: 12, justifyContent: 'flex-end' }}>
              <Button variant="secondary" onClick={() => setShowDeleteModal(null)}>
                Cancel
              </Button>
              <Button variant="danger" onClick={handleDelete}>
                Delete
              </Button>
            </div>
          </Modal>
        </div>
      );
    }

    // ============================================
    // CHAT HISTORY ITEM
    // ============================================
    function ChatHistoryItem({ chat, isActive, onClick }) {
      const [isHovered, setIsHovered] = useState(false);

      const formatTimeAgo = (date) => {
        const seconds = Math.floor((new Date() - date) / 1000);
        if (seconds < 60) return 'Just now';
        if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
        if (seconds < 86400) return `${Math.floor(seconds / 3600)}h ago`;
        if (seconds < 604800) return `${Math.floor(seconds / 86400)}d ago`;
        return date.toLocaleDateString();
      };

      return (
        <div
          onClick={onClick}
          onMouseEnter={() => setIsHovered(true)}
          onMouseLeave={() => setIsHovered(false)}
          style={{
            padding: '12px 14px',
            borderRadius: 'var(--radius-md)',
            background: isActive
              ? 'var(--accent-primary)' + '15'
              : isHovered
                ? 'var(--bg-elevated)'
                : 'transparent',
            border: isActive
              ? '1px solid var(--accent-primary)' + '40'
              : '1px solid transparent',
            cursor: 'pointer',
            transition: 'all 0.15s ease',
          }}
        >
          <div style={{
            fontSize: 13,
            fontWeight: 500,
            color: isActive ? 'var(--accent-primary)' : 'var(--text-primary)',
            marginBottom: 4,
            whiteSpace: 'nowrap',
            overflow: 'hidden',
            textOverflow: 'ellipsis',
          }}>
            {chat.title}
          </div>
          <div style={{
            fontSize: 12,
            color: 'var(--text-muted)',
            marginBottom: 6,
            whiteSpace: 'nowrap',
            overflow: 'hidden',
            textOverflow: 'ellipsis',
          }}>
            {chat.preview}
          </div>
          <div style={{
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'space-between',
            fontSize: 11,
            color: 'var(--text-muted)',
          }}>
            <span>{chat.messageCount} messages</span>
            <span>{formatTimeAgo(chat.createdAt)}</span>
          </div>
        </div>
      );
    }

    // ============================================
    // CHAT HISTORY SIDEBAR

            }}>

            </div>

              onClick={onNewChat}
              style={{
                width: 28,

                color: '#fff',
                cursor: 'pointer',
                display: 'flex',
                alignItems: 'center',

                transition: 'opacity 0.15s',
              }}

          {/* Chat list */}
          <div style={{
            flex: 1,

                padding: '24px 16px',
                textAlign: 'center',

              }}>
                <div style={{
                  width: 40,
                  height: 40,
                  borderRadius: 'var(--radius-md)',
                  background: 'var(--bg-elevated)',
                  display: 'flex',
                  alignItems: 'center',
                  justifyContent: 'center',
                  margin: '0 auto 12px',
                }}>
                  <Icons.MessageSquare />
                </div>
                No conversations yet
                <div style={{ marginTop: 4, fontSize: 12 }}>

                </div>

            ) : (
              <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
                {chats.map(chat => (
                  <ChatHistoryItem
                    key={chat.id}

                  />
                ))}

            )}
          </div>
        </div>
      );

    // ============================================
    // ARTIFACT CARD
    // ============================================
    function ArtifactCard({ artifact, onView, onDownload }) {
      const [isHovered, setIsHovered] = useState(false);

      const getArtifactIcon = () => {
        switch (artifact.type) {
          case 'clip': return <Icons.Film />;
          case 'screenshot': return <Icons.Image />;
          case 'report': return <Icons.FileText />;
          default: return <Icons.File />;
        }
      };

      const getArtifactColor = () => {
        switch (artifact.type) {
          case 'clip': return 'var(--accent-primary)';
          case 'screenshot': return 'var(--accent-info)';
          case 'report': return 'var(--accent-success)';
          default: return 'var(--text-muted)';
        }
      };

      const formatTimeAgo = (date) => {
        const seconds = Math.floor((new Date() - date) / 1000);
        if (seconds < 60) return 'Just now';
        if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
        if (seconds < 86400) return `${Math.floor(seconds / 3600)}h ago`;
        return date.toLocaleDateString();
      };

      return (
        <div
          onMouseEnter={() => setIsHovered(true)}
          onMouseLeave={() => setIsHovered(false)}
          style={{
            background: isHovered ? 'var(--bg-elevated)' : 'var(--bg-tertiary)',
            border: '1px solid var(--border-subtle)',
            borderRadius: 'var(--radius-md)',
            overflow: 'hidden',
            transition: 'all 0.15s ease',
          }}
        >
          {/* Thumbnail area */}
          <div style={{
            height: 80,
            background: 'var(--bg-secondary)',
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'center',
            position: 'relative',
            borderBottom: '1px solid var(--border-subtle)',
          }}>
            <div style={{
              width: 40,
              height: 40,
              borderRadius: 'var(--radius-md)',
              background: getArtifactColor() + '20',
              display: 'flex',
              alignItems: 'center',
              justifyContent: 'center',
              color: getArtifactColor(),
            }}>
              {getArtifactIcon()}
            </div>

            {/* Type badge */}
            <div style={{

          color: 'var(--accent-primary)',
        },
        capture_screenshot: {
          icon: <Icons.Camera />,
          label: 'Capturing screenshot',
          color: 'var(--accent-info)',
        },
        generate_report: {
          icon: <Icons.FileText />,
          label: 'Generating report',
          color: 'var(--accent-success)',
        },
        transcribe: {
          icon: <Icons.MessageSquare />,
          label: 'Transcribing audio',
          color: 'var(--accent-primary)',
        },
        analyze_scene: {
          icon: <Icons.Eye />,
          label: 'Analyzing scene',
          color: 'var(--accent-info)',

          icon: <Icons.Cpu />,

      const isComplete = status === 'complete';
      const isRunning = status === 'running';

      return (

              background: isComplete ? config.color + '10' : 'transparent',

            <div style={{
              width: 28,
              height: 28,
              borderRadius: 'var(--radius-sm)',
              background: config.color + '20',

              alignItems: 'center',
              justifyContent: 'center',

            }}>

                <div style={{

                  height: 14,
                  border: '2px solid ' + config.color,

                  borderRadius: '50%',

                config.icon

            {/* Label & Status */}
            <div style={{ flex: 1 }}>
              <div style={{
                fontSize: 13,
                fontWeight: 500,
                color: 'var(--text-primary)',
                display: 'flex',
                alignItems: 'center',
                gap: 8,
              }}>
                {config.label}
                {isComplete && (
                  <span style={{
                    display: 'inline-flex',
                    alignItems: 'center',
                    gap: 4,
                    padding: '2px 6px',
                    borderRadius: 'var(--radius-sm)',
                    background: 'var(--accent-success)' + '20',
                    color: 'var(--accent-success)',
                    fontSize: 10,
                    fontWeight: 600,
                  }}>
                    <Icons.Check /> Done
                  </span>
                )}
              </div>
              {isRunning && progress && (
                <div style={{
                  fontSize: 11,
                  color: 'var(--text-muted)',
                  marginTop: 2,
                }}>

                </div>
              )}
            </div>

            {/* Expand arrow */}
            <div style={{
              color: 'var(--text-muted)',
              transform: isExpanded ? 'rotate(90deg)' : 'rotate(0deg)',
              transition: 'transform 0.15s',
            }}>
              ▶
            </div>
          </div>

          {/* Progress bar */}
          {isRunning && (
            <div style={{
              height: 2,
              background: 'var(--bg-tertiary)',
              overflow: 'hidden',
            }}>
              <div style={{
                height: '100%',
                width: '30%',
                background: config.color,
                animation: 'progress-indeterminate 1.5s ease-in-out infinite',
              }} />

          {isExpanded && (
            <div style={{

                <span>

                </span>
              )}
              {tool.name === 'transcribe' && (
                <span>
                  Transcribed audio content
                  {result && <> — {result.segments} segments from {result.duration}</>}
                </span>
              )}
              {tool.name === 'analyze_scene' && (
                <span>
                  Analyzed video scenes
                  {result && <> — found {result.objects} objects and {result.speakers} speakers</>}
                </span>
              )}
              {tool.name === 'detect_objects' && (
                <span>
                  Object detection complete
                  {result && <> — identified {result.unique_objects} unique objects</>}
                </span>
              )}
            </div>
          )}
        </div>
      );
    }

    // ============================================
    // STREAMING TEXT
    // ============================================
    function StreamingText({ text, speed = 20 }) {
      const [displayedText, setDisplayedText] = useState('');
      const [isComplete, setIsComplete] = useState(false);

      useEffect(() => {
        if (!text) return;

        let index = 0;
        setDisplayedText('');
        setIsComplete(false);

        const timer = setInterval(() => {
          if (index < text.length) {
            setDisplayedText(text.slice(0, index + 1));
            index++;
          } else {
            setIsComplete(true);
            clearInterval(timer);
          }
        }, speed);

        return () => clearInterval(timer);
      }, [text, speed]);

      return (
        <span>
          {displayedText}
          {!isComplete && (
            <span style={{
              display: 'inline-block',
              width: 2,
              height: 16,
              background: 'var(--accent-primary)',
              marginLeft: 2,
              animation: 'blink 1s infinite',
            }} />
          )}
        </span>
      );
    }

    // ============================================
    // CHAT MESSAGE COMPONENT
    // ============================================
    function ChatMessage({ message, isUser, isStreaming, onArtifactView }) {
      // Handle tool calls
      if (message.type === 'tool_call') {
        return (
          <div style={{ marginBottom: 8 }}>
            <ToolCallBlock
              tool={message.tool}
              status={message.status}
              progress={message.progress}
              result={message.result}
            />
          </div>
        );
      }

      // Handle thinking indicator
      if (message.type === 'thinking') {
        return <ThinkingIndicator />;
      }

      // Regular message
      return (
        <div style={{
          background: isUser ? 'var(--bg-elevated)' : 'var(--bg-tertiary)',
          borderRadius: 'var(--radius-lg)',
          padding: 16,
          borderLeft: isUser ? 'none' : '3px solid var(--accent-success)',
        }}>
          <div style={{
            fontSize: 12,
            fontWeight: 600,
            marginBottom: 8,
            color: isUser ? 'var(--accent-primary)' : 'var(--accent-success)',
          }}>
            {isUser ? 'You' : 'Assistant'}
          </div>
          <div style={{
            fontSize: 14,
            lineHeight: 1.6,
            color: 'var(--text-primary)',
            whiteSpace: 'pre-wrap',
          }}>
            {isStreaming ? (
              <StreamingText text={message.content} speed={15} />
            ) : (
              message.content
            )}
          </div>

          {/* Inline artifacts */}
          {message.artifacts && message.artifacts.length > 0 && (
            <div style={{
              marginTop: 12,
              display: 'flex',
              flexDirection: 'column',
              gap: 8,
            }}>
              {message.artifacts.map((artifact, i) => (
                <ArtifactPreviewInline
                  key={i}
                  artifact={artifact}
                  onView={onArtifactView}
                />
              ))}
            </div>
          )}
        </div>
      );
    }

    // ============================================
    // PROJECT VIEW
    // ============================================
    function ProjectView({ project, onBack, onImport, onUpdateProject }) {
      const [query, setQuery] = useState('');
      const [activeChat, setActiveChat] = useState(null);
      const [currentMessages, setCurrentMessages] = useState([]);
      const [showHistory, setShowHistory] = useState(true);
      const [showArtifacts, setShowArtifacts] = useState(true);
      const { addToast } = useToast();

      // Load chat messages when selecting a chat
      const handleSelectChat = (chat) => {
        setActiveChat(chat);
        setCurrentMessages(chat.messages || []);
      };

      // Start new chat
      const handleNewChat = () => {
        setActiveChat(null);
        setCurrentMessages([]);
      };

      const [isProcessing, setIsProcessing] = useState(false);

      const simulateToolStream = async (userQuery) => {
        // Tool scenarios based on query content
        const scenarios = [
          {
            trigger: /find|search|where|show me|look for/i,
            tools: [
              { name: 'search_videos', params: { query: userQuery, limit: 10 } },
            ],
            response: {
              content: 'I found 3 relevant segments across your videos. The most significant discussion occurs in **Q4_Planning_Session_2.mp4** from 12:34 to 15:22 where the team discusses this topic in detail.\n\nHere\'s what I found:\n• Primary mention at 12:34 (high confidence)\n• Related discussion at 23:15\n• Brief reference at 45:02\n\nWould you like me to extract clips from any of these moments?',
              artifacts: [],
            },
          },
          {
            trigger: /extract|clip|cut|save.*video/i,
            tools: [
              { name: 'search_videos', params: { query: userQuery, limit: 5 } },
              { name: 'extract_clip', params: { source: 'Q4_Planning_Session_2.mp4', start: '12:34', end: '15:22' } },
            ],
            response: {
              content: 'I\'ve extracted the clip you requested. The segment captures the key discussion about revenue targets and team assignments.',
              artifacts: [
                {
                  id: 'art-new-' + Date.now(),
                  type: 'clip',
                  name: 'Revenue Discussion Clip',
                  source: 'Q4_Planning_Session_2.mp4',
                  timestamp: '12:34 - 15:22',
                  duration: '2:48',
                  size: '24.5 MB',
                  createdAt: new Date(),
                },
              ],
            },
          },
          {
            trigger: /screenshot|frame|capture|image/i,
            tools: [
              { name: 'search_videos', params: { query: userQuery, limit: 3 } },
              { name: 'capture_screenshot', params: { source: 'Q4_Planning_Session_2.mp4', timestamp: '14:02' } },
            ],
            response: {
              content: 'I\'ve captured a screenshot from the most relevant frame. This shows the quarterly projections slide that was being presented.',
              artifacts: [
                {
                  id: 'art-new-' + Date.now(),
                  type: 'screenshot',
                  name: 'Quarterly Projections Slide',
                  source: 'Q4_Planning_Session_2.mp4',
                  timestamp: '14:02',
                  size: '1.2 MB',
                  createdAt: new Date(),
                },
              ],
            },
          },
          {
            trigger: /summary|summarize|report|action items|key points/i,
            tools: [
              { name: 'transcribe', params: { source: 'all_videos', language: 'en' } },
              { name: 'analyze_scene', params: { mode: 'summary' } },
              { name: 'generate_report', params: { format: 'pdf', includeTimestamps: true } },
            ],
            response: {
              content: 'I\'ve generated a comprehensive summary report based on all indexed videos.\n\n**Key Findings:**\n• Total meeting time analyzed: 2h 15m\n• 7 action items identified\n• 4 key decisions documented\n• 12 topics discussed\n\nThe report includes timestamps for all major discussion points.',
              artifacts: [
                {
                  id: 'art-new-' + Date.now(),
                  type: 'report',
                  name: 'Meeting Summary Report',
                  format: 'PDF',
                  pages: 8,
                  size: '2.1 MB',
                  createdAt: new Date(),
                },
              ],
            },
          },
          {
            trigger: /detect|identify|recognize|person|object|who/i,
            tools: [
              { name: 'detect_objects', params: { query: userQuery, confidence: 0.8 } },
              { name: 'analyze_scene', params: { mode: 'detailed' } },
            ],
            response: {
              content: 'I\'ve analyzed the video content and identified the following:\n\n**People detected:**\n• Sarah (appears in 8 segments, total 24 min)\n• Mike (appears in 5 segments, total 15 min)\n• 3 other participants\n\n**Objects of interest:**\n• Presentation slides (12 unique slides)\n• Whiteboard content (3 instances)\n• Product demo on screen (2 instances)\n\nWould you like me to extract frames showing any specific person or object?',
              artifacts: [],
            },
          },
        ];

        // Find matching scenario or use default
        let scenario = scenarios.find(s => s.trigger.test(userQuery));
        if (!scenario) {
          scenario = scenarios[0]; // Default to search
        }

        // Simulate the streaming process
        setIsProcessing(true);

        // 1. Add thinking indicator
        setCurrentMessages(prev => [...prev, { type: 'thinking', id: 'thinking-' + Date.now() }]);

        await new Promise(r => setTimeout(r, 800));

        // 2. Remove thinking, start tool calls
        setCurrentMessages(prev => prev.filter(m => m.type !== 'thinking'));

        // 3. Process each tool
        for (let i = 0; i < scenario.tools.length; i++) {
          const tool = scenario.tools[i];
          const toolId = 'tool-' + Date.now() + '-' + i;

          // Add running tool
          setCurrentMessages(prev => [...prev, {
            type: 'tool_call',
            id: toolId,
            tool: tool,
            status: 'running',
            progress: getToolProgress(tool.name, 0),
          }]);

          // Simulate progress updates
          const progressSteps = getProgressSteps(tool.name);
          for (let j = 0; j < progressSteps.length; j++) {
            await new Promise(r => setTimeout(r, 400 + Math.random() * 300));
            setCurrentMessages(prev => prev.map(m =>
              m.id === toolId ? { ...m, progress: progressSteps[j] } : m
            ));
          }

          // Complete tool
          await new Promise(r => setTimeout(r, 300));
          setCurrentMessages(prev => prev.map(m =>
            m.id === toolId ? {
              ...m,
              status: 'complete',
              progress: null,
              result: getToolResult(tool.name),
            } : m
          ));

          // Small delay between tools
          if (i < scenario.tools.length - 1) {
            await new Promise(r => setTimeout(r, 200));
          }
        }

        // 4. Add final response with streaming flag
        await new Promise(r => setTimeout(r, 400));
        const responseMessage = {
          role: 'assistant',
          content: scenario.response.content,
          artifacts: scenario.response.artifacts,
          isStreaming: true,
        };
        setCurrentMessages(prev => [...prev, responseMessage]);

        // 5. After streaming completes, mark as not streaming
        await new Promise(r => setTimeout(r, scenario.response.content.length * 15 + 500));
        setCurrentMessages(prev => prev.map(m =>
          m === responseMessage ? { ...m, isStreaming: false } : m
        ));

        setIsProcessing(false);

        // Add artifacts to project (in real app)
        if (scenario.response.artifacts.length > 0) {
          addToast(`Created ${scenario.response.artifacts.length} artifact(s)`, 'success');
        }
      };

      const getToolProgress = (toolName, step) => {
        const progressMap = {
          search_videos: ['Scanning video index...', 'Matching query...', 'Ranking results...'],
          extract_clip: ['Locating segment...', 'Extracting frames...', 'Encoding clip...'],
          capture_screenshot: ['Finding frame...', 'Capturing...'],
          generate_report: ['Analyzing content...', 'Structuring report...', 'Formatting PDF...'],
          transcribe: ['Processing audio...', 'Transcribing speech...', 'Aligning timestamps...'],
          analyze_scene: ['Detecting objects...', 'Analyzing context...', 'Generating insights...'],
          detect_objects: ['Running detection model...', 'Tracking across frames...', 'Aggregating results...'],
        };
        return (progressMap[toolName] || ['Processing...'])[step] || 'Processing...';
      };

      const getProgressSteps = (toolName) => {
        const stepsMap = {
          search_videos: ['Scanning 12 videos...', 'Found 47 potential matches', 'Ranked top 10 results'],
          extract_clip: ['Located segment at 12:34', 'Extracting 2:48 of video...', 'Encoding H.264...'],
          capture_screenshot: ['Frame located at 14:02', 'Capturing 1920x1080...'],
          generate_report: ['Analyzed 2h 15m of content', 'Identified 7 sections', 'Generating 8-page PDF...'],
          transcribe: ['Processing audio stream...', 'Transcribed 45 minutes', 'Aligned 312 segments'],
          analyze_scene: ['Detected 15 unique objects', 'Identified 4 speakers', 'Generated scene graph'],
          detect_objects: ['YOLOv8 processing...', 'Tracked 23 objects', 'Aggregated 156 detections'],
        };
        return stepsMap[toolName] || ['Processing...', 'Complete'];
      };

      const getToolResult = (toolName) => {
        const results = {
          search_videos: { matches: 10, videos_scanned: 12, top_score: 0.94 },
          extract_clip: { duration: '2:48', size: '24.5 MB', format: 'H.264' },
          capture_screenshot: { resolution: '1920x1080', format: 'PNG' },
          generate_report: { pages: 8, sections: 7, format: 'PDF' },
          transcribe: { duration: '45:00', segments: 312, language: 'en' },
          analyze_scene: { objects: 15, speakers: 4, scenes: 8 },
          detect_objects: { total_detections: 156, unique_objects: 23, confidence_avg: 0.87 },
        };
        return results[toolName] || { status: 'complete' };
      };

      const handleSubmit = () => {
        if (!query.trim() || isProcessing) return;

        if (project.indexed === 0) {
          addToast('Please index videos before querying', 'error');
          return;
        }

        const userQuery = query;
        const userMessage = { role: 'user', content: userQuery };

        setCurrentMessages(prev => [...prev, userMessage]);
        setQuery('');

        // Start the tool streaming simulation
        simulateToolStream(userQuery);

        // Create new chat if needed
        if (!activeChat) {
          const newChat = {
            id: 'chat-' + Date.now(),
            title: userQuery.slice(0, 40) + (userQuery.length > 40 ? '...' : ''),
            preview: userQuery,
            messageCount: 1,
            createdAt: new Date(),
            messages: [userMessage],
          };
          setActiveChat(newChat);
        }
      };

      const handleViewArtifact = (artifact) => {
        addToast(`Opening ${artifact.name}...`, 'info');
      };

      const handleDownloadArtifact = (artifact) => {
        addToast(`Downloading ${artifact.name}...`, 'success');
      };

      return (
        <div style={{ height: '100vh', display: 'flex', flexDirection: 'column' }}>
          {/* Header */}
          <div style={{
            padding: '12px 20px',
            borderBottom: '1px solid var(--border-subtle)',
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'space-between',
            background: 'var(--bg-secondary)',
          }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
              <Button variant="ghost" size="sm" onClick={onBack}>
                <Icons.ArrowLeft />
              </Button>
              <div style={{
                width: 1,
                height: 20,
                background: 'var(--border-subtle)',
              }} />
              <div>
                <h1 style={{ fontSize: 16, fontWeight: 600, marginBottom: 2 }}>{project.name}</h1>
                <div style={{
                  display: 'flex',
                  alignItems: 'center',
                  gap: 12,
                  fontSize: 12,
                  color: 'var(--text-muted)',
                }}>
                  <span>{project.videoCount} videos</span>
                  <span style={{
                    color: project.indexed === project.videoCount
                      ? 'var(--accent-success)'
                      : 'var(--text-muted)',
                  }}>
                    {project.indexed === project.videoCount ? '✓ Indexed' : `${project.indexed}/${project.videoCount} indexed`}
                  </span>
                  {project.preset && (
                    <span style={{
                      padding: '2px 6px',
                      background: 'var(--accent-primary)' + '20',
                      borderRadius: 'var(--radius-sm)',
                      color: 'var(--accent-primary)',
                      fontSize: 10,
                      fontWeight: 500,
                    }}>
                      {project.preset === 'video-analyst' && '🎬 Video Analyst'}
                      {project.preset === 'document-reporter' && '📋 Document Reporter'}
                      {project.preset === 'quick-search' && '⚡ Quick Search'}
                      {project.preset === 'custom' && '🔧 Custom'}
                    </span>
                  )}
                </div>
              </div>
            </div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
              <Button
                variant="ghost"
                size="sm"
                onClick={() => setShowHistory(!showHistory)}
                style={{ color: showHistory ? 'var(--accent-primary)' : 'var(--text-muted)' }}
              >
                <Icons.PanelLeft />
              </Button>
              <Button
                variant="ghost"
                size="sm"
                onClick={() => setShowArtifacts(!showArtifacts)}
                style={{ color: showArtifacts ? 'var(--accent-primary)' : 'var(--text-muted)' }}
              >
                <Icons.PanelRight />
              </Button>
              <div style={{ width: 1, height: 20, background: 'var(--border-subtle)', margin: '0 4px' }} />
              <Button size="sm" onClick={() => {
                onImport?.();
                addToast('Import dialog would open here', 'info');
              }}>
                <Icons.Upload /> Import
              </Button>
            </div>
          </div>

          {/* Main Content Area */}
          <div style={{ flex: 1, display: 'flex', overflow: 'hidden' }}>
            {/* Chat History Sidebar */}
            {showHistory && (
              <ChatHistorySidebar
                chats={project.chatHistory || []}
                activeChat={activeChat}
                onSelectChat={handleSelectChat}
                onNewChat={handleNewChat}
              />
            )}

            {/* Main Chat Area */}
            <div style={{
              flex: 1,
              display: 'flex',
              flexDirection: 'column',
              background: 'var(--bg-primary)',
              minWidth: 0,
            }}>
              {/* Messages */}
              <div style={{ flex: 1, overflow: 'auto', padding: 24 }}>
                {project.videoCount === 0 ? (
                  <EmptyState
                    icon={<Icons.Video />}
                    title="No videos yet"
                    description="Import videos to start analyzing your content."
                    action={
                      <Button onClick={onImport}>
                        <Icons.Upload /> Import Videos
                      </Button>
                    }
                  />
                ) : project.indexed === 0 ? (
                  <EmptyState
                    icon={<Icons.Clock />}
                    title="Indexing required"
                    description="Your videos need to be indexed before you can search and analyze them."
                    action={
                      <Button onClick={() => addToast('Indexing would start here', 'info')}>
                        <Icons.Zap /> Start Indexing
                      </Button>
                    }
                  />
                ) : currentMessages.length === 0 ? (
                  <div style={{
                    height: '100%',
                    display: 'flex',
                    flexDirection: 'column',
                    alignItems: 'center',
                    justifyContent: 'center',
                    textAlign: 'center',
                    padding: 40,
                  }}>
                    <div style={{
                      width: 64,
                      height: 64,
                      borderRadius: 'var(--radius-xl)',
                      background: 'var(--accent-primary)' + '15',
                      display: 'flex',
                      alignItems: 'center',
                      justifyContent: 'center',
                      marginBottom: 20,
                      color: 'var(--accent-primary)',
                    }}>
                      <Icons.Sparkles />
                    </div>
                    <h3 style={{
                      fontSize: 18,
                      fontWeight: 600,
                      marginBottom: 8,
                      color: 'var(--text-primary)',
                    }}>
                      {activeChat ? 'Continue the conversation' : 'Start analyzing your videos'}
                    </h3>
                    <p style={{
                      fontSize: 14,
                      color: 'var(--text-muted)',
                      maxWidth: 400,
                      lineHeight: 1.5,
                      marginBottom: 24,
                    }}>
                      Ask questions about your video content, search for specific moments, or request summaries and reports.
                    </p>
                    <div style={{
                      display: 'flex',
                      flexWrap: 'wrap',
                      gap: 8,
                      justifyContent: 'center',
                    }}>
                      {[
                        'Find all mentions of revenue',
                        'Extract key action items',
                        'Show frames with charts',
                        'Summarize the meeting',
                      ].map(suggestion => (
                        <button
                          key={suggestion}
                          onClick={() => setQuery(suggestion)}
                          style={{
                            padding: '8px 14px',
                            background: 'var(--bg-tertiary)',
                            border: '1px solid var(--border-subtle)',
                            borderRadius: 'var(--radius-md)',
                            fontSize: 13,
                            color: 'var(--text-secondary)',
                            cursor: 'pointer',
                            transition: 'all 0.15s',
                          }}
                          onMouseOver={e => {
                            e.target.style.background = 'var(--bg-elevated)';
                            e.target.style.borderColor = 'var(--accent-primary)';
                            e.target.style.color = 'var(--text-primary)';
                          }}
                          onMouseOut={e => {
                            e.target.style.background = 'var(--bg-tertiary)';
                            e.target.style.borderColor = 'var(--border-subtle)';
                            e.target.style.color = 'var(--text-secondary)';
                          }}
                        >
                          {suggestion}
                        </button>
                      ))}
                    </div>
                  </div>
                ) : (
                  <div style={{ maxWidth: 700, margin: '0 auto' }}>
                    {currentMessages.map((msg, idx) => (
                      <div
                        key={msg.id || idx}
                        className="animate-slide-up"
                        style={{ marginBottom: msg.type === 'tool_call' ? 8 : 16 }}
                      >
                        <ChatMessage
                          message={msg}
                          isUser={msg.role === 'user'}
                          isStreaming={msg.isStreaming}
                          onArtifactView={handleViewArtifact}
                        />
                      </div>
                    ))}
                    {isProcessing && currentMessages.length > 0 && !currentMessages.some(m => m.type === 'thinking' || m.status === 'running') && (
                      <div style={{ marginBottom: 16 }}>
                        <ThinkingIndicator />
                      </div>
                    )}
                  </div>
                )}
              </div>

              {/* Query Input */}
              {project.indexed > 0 && (
                <div style={{
                  padding: '16px 24px',
                  borderTop: '1px solid var(--border-subtle)',
                  background: 'var(--bg-secondary)',
                }}>
                  <div style={{
                    maxWidth: 700,
                    margin: '0 auto',
                    display: 'flex',
                    gap: 12,
                  }}>
                    <div style={{ flex: 1 }}>
                      <Input
                        placeholder={isProcessing ? "Processing..." : "Ask about your videos..."}
                        value={query}
                        onChange={setQuery}
                        disabled={isProcessing}
                        onKeyDown={(e) => {
                          if (e.key === 'Enter' && !e.shiftKey && query.trim() && !isProcessing) {
                            e.preventDefault();
                            handleSubmit();
                          }
                        }}
                        style={{
                          background: 'var(--bg-primary)',
                        }}
                      />
                    </div>
                    <Button onClick={handleSubmit} disabled={!query.trim() || isProcessing}>
                      {isProcessing ? (
                        <div style={{
                          width: 16,
                          height: 16,
                          border: '2px solid currentColor',
                          borderTopColor: 'transparent',
                          borderRadius: '50%',
                          animation: 'spin 1s linear infinite',
                        }} />
                      ) : (
                        <Icons.Send />
                      )}
                    </Button>
                  </div>
                </div>
              )}
            </div>

            {/* Artifacts Panel */}
            {showArtifacts && (
              <ArtifactsPanel
                artifacts={project.artifacts || []}
                onView={handleViewArtifact}
                onDownload={handleDownloadArtifact}
              />
            )}
          </div>
        </div>
      );
    }

    // ============================================
    // THEME CONTEXT
    // ============================================
    const ThemeContext = React.createContext();

    function ThemeProvider({ children }) {
      const [theme, setTheme] = useState(() => {
        const saved = localStorage.getItem('yama-theme');
        return saved || 'dark';
      });

      useEffect(() => {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('yama-theme', theme);
      }, [theme]);

      const toggleTheme = () => {
        setTheme(prev => prev === 'dark' ? 'light' : 'dark');
      };

      return (
        <ThemeContext.Provider value={{ theme, toggleTheme }}>
          {children}
        </ThemeContext.Provider>
      );
    }

    function useTheme() {
      return React.useContext(ThemeContext);
    }

    // ============================================
    // MAIN APP
    // ============================================
    function App() {
      const [projects, setProjects] = useState([
        {
          id: '1',
          name: 'Q4 Planning Review',
          videoCount: 12,
          indexed: 12,
          duration: '2h 15m',
          preset: 'video-analyst',
          updatedAt: new Date(Date.now() - 1000 * 60 * 30),
          chatHistory: [
            {
              id: 'chat-1',
              title: 'Revenue discussion analysis',
              preview: 'Find all moments where revenue targets are discussed...',
              messageCount: 8,
              createdAt: new Date(Date.now() - 1000 * 60 * 60 * 2),
              messages: [
                { role: 'user', content: 'Find all moments where revenue targets are discussed' },
                { role: 'assistant', content: 'I found 4 relevant segments across 3 videos where revenue targets are mentioned. The most detailed discussion occurs in "Q4_Planning_Session_2.mp4" from 12:34 to 15:22 where Sarah presents the quarterly projections.' },
                { role: 'user', content: 'Extract that clip and show me the key numbers mentioned' },
                { role: 'assistant', content: 'I\'ve extracted the clip (3:48 duration) and identified the following key figures:\n\n• Q4 Target: $2.4M\n• Current Run Rate: $1.8M\n• Gap to Close: $600K\n• Required Growth: 33%\n\nThe clip has been saved to your artifacts.' },
              ],
            },
            {
              id: 'chat-2',
              title: 'Action items extraction',
              preview: 'What action items were assigned in the meeting...',
              messageCount: 5,
              createdAt: new Date(Date.now() - 1000 * 60 * 60 * 24),
              messages: [
                { role: 'user', content: 'What action items were assigned in the meeting?' },
                { role: 'assistant', content: 'I identified 7 action items across the planning sessions:\n\n1. **Mike**: Finalize vendor contracts by Oct 15\n2. **Sarah**: Present revised projections to board\n3. **Team Lead**: Schedule weekly syncs\n4. **Marketing**: Launch campaign by Nov 1\n5. **Ops**: Audit current processes\n6. **HR**: Complete hiring for Q4\n7. **Finance**: Budget reallocation proposal' },
              ],
            },
            {
              id: 'chat-3',
              title: 'Speaker identification',
              preview: 'Who spoke the most in these meetings...',
              messageCount: 3,
              createdAt: new Date(Date.now() - 1000 * 60 * 60 * 24 * 2),
              messages: [],
            },
          ],
          artifacts: [
            {
              id: 'art-1',
              type: 'clip',
              name: 'Revenue Discussion - Q4 Targets',
              source: 'Q4_Planning_Session_2.mp4',
              timestamp: '12:34 - 15:22',
              duration: '2:48',
              thumbnail: null,
              createdAt: new Date(Date.now() - 1000 * 60 * 60),
              size: '24.5 MB',
            },
            {
              id: 'art-2',
              type: 'screenshot',
              name: 'Quarterly Projections Slide',
              source: 'Q4_Planning_Session_2.mp4',
              timestamp: '14:02',
              thumbnail: null,
              createdAt: new Date(Date.now() - 1000 * 60 * 90),
              size: '1.2 MB',
            },
            {
              id: 'art-3',
              type: 'report',
              name: 'Meeting Summary - Oct 5',
              format: 'PDF',
              pages: 4,
              createdAt: new Date(Date.now() - 1000 * 60 * 60 * 24),
              size: '892 KB',
            },
            {
              id: 'art-4',
              type: 'clip',
              name: 'Team Introductions',
              source: 'Q4_Kickoff.mp4',
              timestamp: '00:00 - 05:30',
              duration: '5:30',
              thumbnail: null,
              createdAt: new Date(Date.now() - 1000 * 60 * 60 * 24 * 2),
              size: '48.2 MB',
            },
          ],
        },
        {
          id: '2',
          name: 'Training Videos',
          videoCount: 8,
          indexed: 5,
          duration: '1h 45m',
          preset: 'document-reporter',
          updatedAt: new Date(Date.now() - 1000 * 60 * 60 * 24),
          chatHistory: [
            {
              id: 'chat-4',
              title: 'Safety protocol search',
              preview: 'Show me all safety protocols mentioned...',
              messageCount: 4,
              createdAt: new Date(Date.now() - 1000 * 60 * 60 * 48),
              messages: [],
            },
          ],
          artifacts: [
            {
              id: 'art-5',
              type: 'report',
              name: 'Training Compliance Report',
              format: 'PDF',
              pages: 12,
              createdAt: new Date(Date.now() - 1000 * 60 * 60 * 48),
              size: '2.4 MB',
            },
          ],
        },
        {
          id: '3',
          name: 'Customer Feedback Sessions',
          videoCount: 24,
          indexed: 24,
          duration: '4h 30m',
          preset: 'quick-search',
          updatedAt: new Date(Date.now() - 1000 * 60 * 60 * 24 * 3),
          chatHistory: [],
          artifacts: [],
        },
        {
          id: '4',
          name: 'Product Demo Collection',
          videoCount: 6,
          indexed: 0,
          duration: '45m',
          preset: 'custom',
          updatedAt: new Date(Date.now() - 1000 * 60 * 60 * 24 * 7),
          chatHistory: [],
          artifacts: [],
        },
      ]);
      const [currentProject, setCurrentProject] = useState(null);

      const handleCreateProject = (projectData) => {
        // Handle both simple name string and full wizard data
        const name = typeof projectData === 'string' ? projectData : projectData.name;
        const files = typeof projectData === 'object' ? projectData.files : [];
        const preset = typeof projectData === 'object' ? projectData.selectedPreset : 'video-analyst';
        const tools = typeof projectData === 'object' ? projectData.enabledTools : [];
        const description = typeof projectData === 'object' ? projectData.description : '';
        const tags = typeof projectData === 'object' ? projectData.tags : [];

        const newProject = {
          id: Date.now().toString(),
          name,
          description,
          tags,
          videoCount: files.length,
          indexed: 0,
          duration: null,
          updatedAt: new Date(),
          preset,
          tools,
          chatHistory: [],
          artifacts: [],
        };
        setProjects([newProject, ...projects]);
      };

      const handleDeleteProject = (id) => {
        setProjects(projects.filter(p => p.id !== id));
      };

      return (
        <ThemeProvider>
          <AppContent
            projects={projects}
            currentProject={currentProject}
            setCurrentProject={setCurrentProject}
            handleCreateProject={handleCreateProject}
            handleDeleteProject={handleDeleteProject}
          />
        </ThemeProvider>
      );
    }

    function AppContent({ projects, currentProject, setCurrentProject, handleCreateProject, handleDeleteProject }) {
      const { theme, toggleTheme } = useTheme();

      return (
        <ToastProvider>
          <div style={{ minHeight: '100vh', background: 'var(--bg-primary)', transition: 'background 0.2s' }}>
            {/* Top Bar */}
            <div style={{
              padding: '12px 24px',
              borderBottom: '1px solid var(--border-subtle)',
              display: 'flex',
              alignItems: 'center',
              justifyContent: 'space-between',
              background: 'var(--bg-secondary)',
              transition: 'background 0.2s, border-color 0.2s',
            }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                <div style={{
                  width: 28,
                  height: 28,
                  background: 'var(--accent-primary)',
                  borderRadius: 6,
                  display: 'flex',
                  alignItems: 'center',
                  justifyContent: 'center',
                  fontWeight: 700,
                  fontSize: 14,
                  color: theme === 'dark' ? '#000' : '#fff',
                }}>◆</div>
                <span style={{ fontWeight: 600, fontSize: 16, color: 'var(--text-primary)' }}>Yama</span>
                <span style={{
                  padding: '2px 8px',
                  background: 'var(--bg-elevated)',
                  border: '1px solid var(--border-subtle)',
                  borderRadius: 'var(--radius-sm)',
                  fontSize: 11,
                  color: 'var(--text-muted)',
                  fontWeight: 500,
                }}>Content Analyst</span>
              </div>

              {/* Theme Toggle */}
              <button
                onClick={toggleTheme}
                style={{
                  width: 36,
                  height: 36,
                  borderRadius: 'var(--radius-md)',
                  background: 'var(--bg-tertiary)',
                  border: '1px solid var(--border-subtle)',
                  color: 'var(--text-secondary)',
                  cursor: 'pointer',
                  display: 'flex',
                  alignItems: 'center',
                  justifyContent: 'center',
                  transition: 'all 0.15s',
                }}
                onMouseOver={e => {
                  e.currentTarget.style.background = 'var(--bg-hover)';
                  e.currentTarget.style.color = 'var(--text-primary)';
                }}
                onMouseOut={e => {
                  e.currentTarget.style.background = 'var(--bg-tertiary)';
                  e.currentTarget.style.color = 'var(--text-secondary)';
                }}
                title={theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'}
              >
                {theme === 'dark' ? <Icons.Sun /> : <Icons.Moon />}
              </button>
            </div>

            {/* Content */}
            {currentProject ? (
              <ProjectView
                project={currentProject}
                onBack={() => setCurrentProject(null)}
                onImport={() => {}}
              />
            ) : (
              <Dashboard
                projects={projects}
                onOpenProject={setCurrentProject}
                onCreateProject={handleCreateProject}
                onDeleteProject={handleDeleteProject}
              />
            )}
          </div>
        </ToastProvider>
      );
    }
    // End of AppContent

    // ============================================
    // RENDER
    // ============================================
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
