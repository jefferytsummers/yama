[package]
name = "yama-container-sdk"
version.workspace = true
edition = "2024"
license.workspace = true
description = "Yama Container SDK - Client utilities for containerized services"

[dependencies]
# Protocol types
yama-protocol = { path = "../protocol" }

# Async runtime
tokio = { workspace = true }
futures-util = { workspace = true }

# Serialization
prost = { workspace = true }
