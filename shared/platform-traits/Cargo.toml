[package]
name = "yama-platform-traits"
version.workspace = true
edition = "2024"
license.workspace = true
description = "Yama platform abstraction traits - defines interfaces for platform-specific implementations"

[dependencies]
# Async runtime
tokio = { workspace = true }
futures-util = { workspace = true }
async-trait = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Serialization (for config types)
serde = { workspace = true }
serde_json = { workspace = true }

# Logging
tracing = { workspace = true }

# Bytes for buffer handling
bytes = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Unix-specific for file descriptors
rustix = { workspace = true }
libc = { workspace = true }

[dev-dependencies]
tokio-test = "0.4"
