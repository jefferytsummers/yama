[package]
name = "yama-tauri"
version = "0.1.0"
edition = "2024"
description = "Yama desktop application - Tauri wrapper for SvelteKit frontend"
license = "MIT OR Apache-2.0"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
# Tauri core
tauri = { version = "2.0", features = ["macos-private-api"] }
tauri-plugin-dialog = "2.0"
tauri-plugin-shell = "2.0"
tauri-plugin-fs = "2.0"

# Yama host services (headless mode)
yama-host-apple = { path = "../platform/apple/host", default-features = false }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
