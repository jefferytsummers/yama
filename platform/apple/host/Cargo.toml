[package]
name = "yama-host-apple"
version.workspace = true
edition = "2024"
license.workspace = true
description = "Yama host compositor for Apple Silicon (Metal/MoltenVK)"

[[bin]]
name = "yama"
path = "src/main.rs"

[[bin]]
name = "yama-headless"
path = "src/bin/headless.rs"

[[bin]]
name = "yama-event-bus"
path = "src/bin/event-bus.rs"

[dependencies]
# Internal crates
yama-protocol = { path = "../../../shared/protocol" }
yama-platform-traits = { workspace = true }
yama-agent-sdk = { path = "../../../shared/agent-sdk" }
yama-container-sdk = { path = "../../../shared/container-sdk" }
yama-theme = { path = "../../../shared/yama-theme" }

# Async runtime
tokio = { workspace = true }
futures-util = { workspace = true }
async-trait = { workspace = true }

# Graphics (Metal-based rendering on macOS, no Smithay/Wayland)
wgpu = { workspace = true }
ash = { workspace = true }

# GUI
egui = { workspace = true }
egui_dock = { workspace = true }
eframe = { workspace = true }

# GStreamer
gstreamer = { workspace = true }
gstreamer-app = { workspace = true }
gstreamer-video = { workspace = true }
gstreamer-pbutils = "0.23"

# Container management
bollard = { workspace = true }

# Protocol
prost = { workspace = true }
bytes = { workspace = true }

# Network
tokio-tungstenite = { workspace = true }

# HTTP server
axum = { workspace = true, features = ["multipart"] }
tower = { workspace = true }
tower-http = { workspace = true }

# HTTP client (for model downloads)
reqwest = { version = "0.12", features = ["stream"] }

# File handling
tempfile = { workspace = true }
uuid = { workspace = true }
rfd = "0.15"

# Concurrency
dashmap = { workspace = true }

# CLI parsing (for headless binary)
clap = { version = "4", features = ["derive"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
dirs-next = "2.0"

# VLM inference (direct in-process) - optional, requires Xcode for Metal shaders
mistralrs = { version = "0.7", default-features = false, features = ["metal"], optional = true }

# Image processing (for VLM input conversion)
image = { workspace = true }

# ONNX Runtime for embeddings (CLIP, text embeddings)
ort = { version = "2.0.0-rc.12", features = ["coreml", "ndarray"] }
ndarray = "0.17"

# Whisper transcription (with Metal acceleration)
whisper-rs = "0.12"

# Audio processing
gstreamer-audio = "0.23"
bytemuck = { version = "1.14", features = ["derive"] }

# JSON Schema validation for tool input
jsonschema = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
# macOS-specific dependencies
metal = "0.29"
cocoa = "0.26"
core-foundation = "0.10"

[dev-dependencies]
yama-test-harness = { path = "../../../shared/test-harness" }
tokio-test = "0.4"

[features]
default = ["metal"]
metal = []
moltenvk = []
# Enable direct in-process VLM inference (requires Xcode for Metal shader compilation)
direct-vlm = ["dep:mistralrs"]
