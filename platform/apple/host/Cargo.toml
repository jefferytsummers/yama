[package]
name = "yama-host-apple"
version.workspace = true
edition = "2024"
license.workspace = true
description = "Yama host compositor for Apple Silicon (Metal/MoltenVK)"

[[bin]]
name = "yama"
path = "src/main.rs"

[[bin]]
name = "yama-headless"
path = "src/bin/headless.rs"

[dependencies]
# Internal crates
yama-protocol = { path = "../../../shared/protocol" }
yama-platform-traits = { workspace = true }
yama-agent-sdk = { path = "../../../shared/agent-sdk" }
yama-container-sdk = { path = "../../../shared/container-sdk" }
yama-theme = { path = "../../../shared/yama-theme" }

# Async runtime
tokio = { workspace = true }
futures-util = { workspace = true }
async-trait = { workspace = true }

# Graphics (Metal-based rendering on macOS, no Smithay/Wayland)
wgpu = { workspace = true }
ash = { workspace = true }

# GUI
egui = { workspace = true }
egui_dock = { workspace = true }
eframe = { workspace = true }

# GStreamer
gstreamer = { workspace = true }
gstreamer-app = { workspace = true }
gstreamer-video = { workspace = true }

# Container management
bollard = { workspace = true }

# Protocol
prost = { workspace = true }
bytes = { workspace = true }

# Network
tokio-tungstenite = { workspace = true }

# HTTP server
axum = { workspace = true, features = ["multipart"] }
tower = { workspace = true }
tower-http = { workspace = true }

# File handling
tempfile = { workspace = true }
uuid = { version = "1.11", features = ["v4"] }
rfd = "0.15"

# CLI parsing (for headless binary)
clap = { version = "4", features = ["derive"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
# macOS-specific dependencies
metal = "0.29"
cocoa = "0.26"
core-foundation = "0.10"

[dev-dependencies]
yama-test-harness = { path = "../../../shared/test-harness" }
tokio-test = "0.4"

[features]
default = ["metal"]
metal = []
moltenvk = []
