[package]
name = "yama-host-jetson"
version.workspace = true
edition = "2024"
license.workspace = true
description = "Yama host compositor for NVIDIA Jetson (EGL/DRM + CUDA)"

[[bin]]
name = "yama"
path = "src/main.rs"

[dependencies]
# Internal crates
yama-protocol = { path = "../../../shared/protocol" }
yama-platform-traits = { workspace = true }
yama-agent-sdk = { path = "../../../shared/agent-sdk" }
yama-container-sdk = { path = "../../../shared/container-sdk" }

# Async runtime
tokio = { workspace = true }
futures-util = { workspace = true }
async-trait = { workspace = true }

# Compositor
smithay = { workspace = true }

# Graphics
wgpu = { workspace = true }
ash = { workspace = true }

# GUI
egui = { workspace = true }
egui_dock = { workspace = true }
eframe = { workspace = true }

# GStreamer
gstreamer = { workspace = true }
gstreamer-app = { workspace = true }
gstreamer-video = { workspace = true }
gstreamer-pbutils = { workspace = true }

# Container management
bollard = { workspace = true }

# Protocol
prost = { workspace = true }
bytes = { workspace = true }

# Network
tokio-tungstenite = { workspace = true }
reqwest = { workspace = true }

# Image processing
image = { workspace = true }

# Encoding
base64 = "0.22"

# Async utilities
futures = { workspace = true }

# Concurrency
dashmap = { workspace = true }
uuid = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Linux-specific for Jetson
libc = "0.2"

[features]
default = ["egl"]
egl = []
cuda = []
