[package]
name = "yama-inference-jetson"
version.workspace = true
edition = "2024"
license.workspace = true
description = "Yama inference service for NVIDIA Jetson (TensorRT-LLM/llama.cpp + CUDA)"

[[bin]]
name = "yama-inference"
path = "src/main.rs"

[dependencies]
# Internal crates
yama-protocol = { path = "../../../shared/protocol" }
yama-platform-traits = { workspace = true }
yama-container-sdk = { path = "../../../shared/container-sdk" }

# Async runtime
tokio = { workspace = true }
futures-util = { workspace = true }
async-stream = { workspace = true }
async-trait = { workspace = true }

# HTTP for LLM API
reqwest = { workspace = true }

# Protocol
prost = { workspace = true }
bytes = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
