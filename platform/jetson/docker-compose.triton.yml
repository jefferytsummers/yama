# Docker Compose for VLM Inference on Jetson Thor
#
# Deploys VLM inference using LLaVA with optional Triton backend.
#
# Prerequisites:
# 1. Build VLM container: ./scripts/build_vlm_container.sh
# 2. Download model: ./scripts/download_llava.sh
# 3. Docker with nvidia runtime (default on Thor)
#
# Usage:
#   docker-compose -f docker-compose.triton.yml up -d
#
# Endpoints:
#   - HTTP: http://localhost:8000
#   - gRPC: localhost:8001
#   - Metrics: http://localhost:8002
#
# Target: Jetson Thor (128GB, CUDA 13.0, L4T R38)

services:
  # Primary VLM inference service using LLaVA
  vlm:
    image: yama-vlm:r38
    container_name: yama-vlm
    runtime: nvidia
    restart: unless-stopped

    # Environment
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
      - HF_HOME=/data/cache/huggingface
      # Model configuration (using HuggingFace-compatible format)
      - VLM_MODEL_PATH=/data/models/llava/llava-1.5-7b-hf
      - VLM_DTYPE=float16
      - VLM_MAX_NEW_TOKENS=512
      # Memory optimization for 128GB Thor
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:512
      - OMP_NUM_THREADS=8

    # Port mappings
    ports:
      - "8000:8000"  # HTTP API
      - "8001:8001"  # gRPC (if enabled)
      - "8002:8002"  # Metrics

    # Volume mounts
    volumes:
      # Model storage
      - ${MODELS_PATH:-/home/jeff/data/models}:/data/models:ro
      # VLM server script
      - ./scripts/vlm_server.py:/app/vlm_server.py:ro
      # Cache directory
      - vlm-cache:/data/cache
      # Yama event bus socket
      - /tmp/yama-event.sock:/tmp/yama-event.sock
      # Shared memory for zero-copy
      - /dev/shm:/dev/shm

    # Memory configuration (128GB allows generous allocation)
    shm_size: '16gb'

    # Health check
    healthcheck:
      test: ["CMD", "python3", "-c", "import torch; assert torch.cuda.is_available()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

    # Run inference server
    command: ["python3", "/app/vlm_server.py"]

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  # Optional: Triton Inference Server for production deployment
  # Uses custom Python backend for LLaVA
  triton:
    image: yama-vlm:r38
    container_name: yama-triton
    runtime: nvidia
    restart: unless-stopped
    profiles:
      - triton  # Only start with: docker-compose --profile triton up

    environment:
      - CUDA_VISIBLE_DEVICES=0
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility

    ports:
      - "8010:8000"  # HTTP (offset to avoid conflict with vlm service)
      - "8011:8001"  # gRPC
      - "8012:8002"  # Metrics

    volumes:
      - ./triton-models:/models:ro
      - triton-cache:/cache
      - /dev/shm:/dev/shm

    shm_size: '16gb'

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v2/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

    command: >
      tritonserver
      --model-repository=/models
      --strict-model-config=false
      --log-verbose=1
      --log-info=true
      --log-warning=true
      --log-error=true
      --http-port=8000
      --grpc-port=8001
      --metrics-port=8002

  # Model downloader utility
  model-downloader:
    image: yama-vlm:r38
    container_name: yama-model-downloader
    runtime: nvidia
    profiles:
      - download

    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
      - HF_HOME=/data/cache/huggingface

    volumes:
      - ${MODELS_PATH:-/home/jeff/data/models}:/data/models
      - vlm-cache:/data/cache

    command: >
      python3 -c "
      from huggingface_hub import snapshot_download
      import os

      model_id = os.environ.get('MODEL_ID', 'llava-hf/llava-1.5-7b-hf')
      local_dir = '/data/models/llava/llava-1.5-7b-hf'

      print(f'Downloading {model_id}...')
      snapshot_download(
          repo_id=model_id,
          local_dir=local_dir,
          local_dir_use_symlinks=False,
      )
      print('Download complete!')
      "

volumes:
  vlm-cache:
    driver: local
  triton-cache:
    driver: local

networks:
  default:
    name: yama-network
